<div class="login-container flex align-items-center justify-content-center min-h-screen surface-ground">
  <p-card header="Acceso al Sistema" subheader="Gestión de Inventario" class="login-card">
    
    <div class="flex flex-column gap-3 mt-3">
      <div class="flex flex-column gap-2">
        <label for="username">Usuario de Red</label>
        <input 
          pInputText 
          id="username" 
          [(ngModel)]="username" 
          (keydown.enter)="onLogin()"
          placeholder="Ej: jdoe" 
          />
      </div>

      <div class="flex flex-column gap-2">
        <label for="password">Contraseña</label>
        <input 
          pInputText 
          type="password"
          id="password" 
          [(ngModel)]="password" 
          (keydown.enter)="onLogin()"
          placeholder="••••••••" 
          />
      </div>

      <p-message *ngIf="errorMsg" severity="error" [text]="errorMsg"></p-message>

      <p-button 
        label="Ingresar" 
        icon="pi pi-sign-in" 
        [loading]="loading" 
        (onClick)="onLogin()" 
        styleClass="w-full mt-2">
      </p-button>
    </div>

  </p-card>
</div>
